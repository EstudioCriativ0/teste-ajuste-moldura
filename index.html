<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moldura Fazendinha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #frame-9x16 { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); aspect-ratio:9/16; height:100vh; max-height:100vh; max-width:calc(100vh*9/16); background:#000; overflow:hidden; }
    #video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #overlay { pointer-events:none; z-index:2; }
  </style>
</head>
<body>
  <div id="frame-9x16">
    <video id="video" autoplay muted playsinline></video>
    <img id="overlay" src="moldura.png" />
  </div>
</body>
</html>
